# Mettere in: .github/workflows/build-iso.yml
# NON TESTATO: generato dalla documentazione dell'Action e da esempi pubblici
# (Bazzite). Controlla i nomi degli input sulla pagina Marketplace di
# "Build Container Installer" prima del primo lancio.
name: Build ISO

on:
  workflow_dispatch: # si lancia a mano da GitHub > Actions > Build ISO > Run workflow

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Build ISO
        id: build
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_repo: ghcr.io/kasull-454 # minuscolo, come l'immagine pubblicata dal tuo build
          image_name: chiyuki
          image_tag: latest
          version: 44 # versione di Fedora della base (Aurora su Fedora 44)
          variant: Kinoite
          iso_name: chiyuki-latest-44.iso

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          compression-level: 0 # l'ISO è già compressa
