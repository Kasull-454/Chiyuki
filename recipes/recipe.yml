        - appmenu-gtk-module-wayland
        - aria2
    # ─── B ─────────────────────────────────────────
        - bazzite-portal
        - bibata-cursor-theme
        - bore-sysctl
        - btop
        - btrfs-assistant  # btrfs gui tool
        - btrfs-progs
    # ─── C ─────────────────────────────────────────
        - cachyos-ananicy-rules
        - cachyos-ksm-settings
        - cachyos-settings
        - cargo
        - cava
        - cmake
        - coolercontrol
        - coolercontrold
        - cups-pdf
    # ─── D ─────────────────────────────────────────
        - darkly
        - dnf-plugins-core
    #    - dmemcg-booster => non so
    # ─── E ─────────────────────────────────────────
        - exiv2
    # ─── F ─────────────────────────────────────────
        - falcond
        - falcond-gui
    #    - fancontrol-gui
        - fancontrol-gui-kcm
        - fancontrol-gui-plasmoid
        - fish
        - floorp
        - fwupd
    # ─── G ─────────────────────────────────────────
        - gamescope
        - gcc-c++
        - git
        - git-credential-libsecret
    #    - gtk-nocsd
    # ─── H ─────────────────────────────────────────
        - hunspell-it
    # ─── I ─────────────────────────────────────────
        - inputplumber
    # ─── J ─────────────────────────────────────────
    # ─── K ─────────────────────────────────────────
        - kcalc
    #    - kcm_gamecontroller
        - kcm_systemd
    #   - kcm_ublue
        - kdenlive
        - kglance
        - klassy
#        - kora-icon-theme => non trovato in nessun repo abilitato (build del 4/10)
    #    - krunner-yafti => dà un problema di dipendenze
    #    - kunifiedpush => già presente
        - kwin6-bismuth-decoration
        - kwin-effects-better-blur-dx
        - kwin-effects-glass
    #    - kwrite => già presente
    # ─── L ─────────────────────────────────────────
        - lact
        - langpacks-it
        - lgl-scxctl-manager
    #    - libdnf5-plugin-snapper
        - libreoffice
    #    - lm_sensors => già presente
    # ─── M ─────────────────────────────────────────
        - material-icons-fonts
        - micro
    # ─── O ─────────────────────────────────────────
        - okular
        - open-sans-fonts
    # ─── P ─────────────────────────────────────────
    #    - PackageKit-backend-dnf5
        - papirus-icon-theme
#        - papirus-folders => non trovato in nessun repo abilitato (build del 4/10)
        - pipx
        - plasma-applet-appgrid
        - plasma-discover
        - plasma-discover-flatpak
        - plasma-discover-kns
        - plasma-discover-libs
        - plasma-discover-notifier
    #    - plasma-discover-offline-updates
        - plasma-discover-rpm-ostree
        - podman-compose # richiesto da winboat (percorso Podman, non Docker)
    #    - proton-vpn-gtk-app => per l'errore di cui sopra
        - python3-pip
        - python3-virtualenvwrapper
        - python3-devel
    # ─── R ─────────────────────────────────────────
    #    - restic
    #    - rsync
        - rsms-inter-fonts
