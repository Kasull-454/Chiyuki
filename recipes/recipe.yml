# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# ═══════════════════════════════════════════════════════════════
# CHIYUKI — recipe unico (v0.1)
# ═══════════════════════════════════════════════════════════════
# Immagine desktop Linux immutabile personalizzata, basata su uBlue/Aurora
# (Kinoite, Fedora 44) con BlueBuild. Kernel Bazzite/CachyOS, COPR per
# plasmoidi/temi, layering applicativo via Distrobox/apx.
#
# Nome: Chiyuki, dal personaggio di Death Parade. Storia del progetto:
# Swordfish → Chiyuki (repo GitHub Kasull-454/Chiyuki). Il nome è definitivo.
#
# I moduli sono eseguiti DALL'ALTO IN BASSO: l'ordine conta.
#   repo+pacchetti → kernel → servizi extra → pulizia → flatpak → systemd
#   → initramfs → firma
# Gli script del primo login (Konveyor, Syncthing Monitor) NON stanno qui:
# vivono in files/system/ (vedi modulo "files" e sezione systemd).
name: chiyuki
description: ISO a uso personale, per test e lavoro.
base-image: ghcr.io/ublue-os/aurora
image-version: latest # Puoi anche pinnare una versione specifica di Fedora

modules:


  # ───────────────────────────────────────────────
  # ─ FILES ───────────────────────────────────────
  # ───────────────────────────────────────────────
  - type: files
    files:
      - source: system
        destination: / # copia files/system/* (* = tutto il contenuto) nella root dell'immagine

  # ───────────────────────────────────────────────
  # ─ OS RELEASE ──────────────────────────────────
  # ───────────────────────────────────────────────
  - type: os-release
    properties:
      NAME: "Chiyuki"
      PRETTY_NAME: "Chiyuki (AuroraOS)"
      ID: "chiyuki"
      ID_LIKE: "fedora"
      VERSION_ID: "44/01"
      VERSION_CODENAME: "Aaroniero" # fase alpha = "minion" (A: Aaroniero, B: Baraggan, ...)
    #  LOGO: "fedora-logo-icon"
      DEFAULT_HOSTNAME: "chiyuki"
      HOME_URL: "https://github.com/Kasull-454/Chiyuki"
      SUPPORT_URL: "https://github.com/Kasull-454/Chiyuki/issues"
      BUG_REPORT_URL: "https://github.com/Kasull-454/Chiyuki/issues"

  # ───────────────────────────────────────────────
  # ─ REPO | COPR | PACCHETTI ─────────────────────
  # ───────────────────────────────────────────────
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    #    - https://repo.nobaraproject.org/rolling/x86_64/kernel-mainline/nobara-kernel-mainline.repo => continua a dare errore, eppure l'url è corretto (in lavorazione)
#        - https://repo.rakuos.org/rakuos.repo => RIMOSSO (build del 4/10): porta "rum", il gestore di pacchetti di RakuOS, che prende il posto di dnf5 e rompe i passi successivi
        - https://copr.fedorainfracloud.org/coprs/ama1470/kwin-effects-glass/repo/fedora-44/ama1470-kwin-effects-glass-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-44/atim-starship-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos/repo/fedora-44/bieszczaders-kernel-cachyos-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/repo/fedora-44/bieszczaders-kernel-cachyos-addons-fedora-44.repo
    #    - https://copr.fedorainfracloud.org/coprs/catpieleaf/kernel-p03/repo/fedora-44/catpieleaf-kernel-p03-fedora-44.repo => P03 non ancora stabile, riabilitare quando lo sarà
        - https://copr.fedorainfracloud.org/coprs/deltacopy/darkly/repo/fedora-44/deltacopy-darkly-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/errornointernet/klassy/repo/fedora-44/errornointernet-klassy-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/gloriouseggroll/linux-nobara-mainline/repo/fedora-44/gloriouseggroll-linux-nobara-mainline-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/hazel-bunny/ricing/repo/fedora-44/hazel-bunny-ricing-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/infinality/kwin-effects-better-blur-dx/repo/fedora-44/infinality-kwin-effects-better-blur-dx-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/joviatrix/winboat/repo/fedora-44/joviatrix-winboat-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/linuxgamerlife/lgl-scxctl-manager/repo/fedora-44/linuxgamerlife-lgl-scxctl-manager-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/lusan/kglance/repo/fedora-44/lusan-kglance-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/predze/ludora/repo/fedora-44/predze-ludora-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/scujas/plasma-applet-appgrid/repo/fedora-44/scujas-plasma-applet-appgrid-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/theblackdon/kineticwe/repo/fedora-44/theblackdon-kineticwe-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/ublue-os/akmods/repo/fedora-44/ublue-os-akmods-fedora-44.repo
        - https://copr.fedorainfracloud.org/coprs/ublue-os/bazzite/repo/fedora-44/ublue-os-bazzite-fedora-44.repo
    #    - https://copr.fedorainfracloud.org/coprs/ublue-os/staging/repo/fedora-44/ublue-os-staging-fedora-44.repo => già presente in Aurora
    #    - https://copr.fedorainfracloud.org/coprs/ublue-os/packages/repo/fedora-44/ublue-os-packages-fedora-44.repo => già presente in Aurora
    #  copr:
    #    => inseriti come file qui sopra
    remove:
      packages:
        - fcitx5
        - firefox
        - flatpak-kcm
        - input-remapper-gtk
        - plasma-settings
        - sunshine
        - tuned
        - tuned-ppd
        - zram-generator-defaults
    install:
      skip-unavailable: true
      # falcond (Terra) fornisce "gamemode" ed è in conflitto con il pacchetto gamemode
      # già presente in Aurora: con allow-erasing dnf rimuove gamemode e installa falcond.
      # Guarda nel log della build cosa viene rimosso.
      allow-erasing: true
      # precauzione: rum (RakuOS) non deve mai entrare nell'immagine al posto di dnf5
      exclude:
        - rum
      install-weak-deps: false
      packages:
    # ─── A ─────────────────────────────────────────
