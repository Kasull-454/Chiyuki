    # ─── Nessun RPM locale. Proton Pass e Proton VPN: installati a mano dall'utente (Flatpak utente) ───

  # ───────────────────────────────────────────────
  # ─ CUSTOM KERNEL — Bazzite/CachyOS ─────────────
  # ───────────────────────────────────────────────
  # Nessun modulo "custom-kernel" dedicato risulta esistere nell'ecosistema
  # BlueBuild ufficiale o community: il pattern usato dalla community per
  # sostituire il kernel su immagini ublue è uno snippet Containerfile grezzo
  # (vedi J58.md). Va rimosso esplicitamente il kernel stock prima di
  # installare quello nuovo, altrimenti rpm-ostree/dnf trova due kernel
  # ("multiple kernels found") e il rebase/boot fallisce.
  #
  # I repo bieszczaders/kernel-cachyos e kernel-cachyos-addons sono già
  # abilitati da packages-common.yml (che gira prima nell'ordine dei moduli),
  # quindi qui non serve un altro "dnf copr enable".
  #
  # ATTENZIONE: togliere il kernel stock rimuove anche, come dipendenti, i moduli
  # kernel costruiti per quel kernel (visto nel build del 4/10): kmod-xone,
  # xone-kmod-common, kmod-v4l2loopback, v4l2loopback, virtualbox-guest-additions.
  # Con il kernel CachyOS non tornano da soli: servono versioni per quel kernel.
  # La spelling giusta del flag dnf5 è --allowerasing (senza trattino).
  #
  # Piano B (non attivo): se il kernel Bazzite/CachyOS dovesse dare problemi
  # di dipendenze/akmods, il COPR gloriouseggroll/linux-nobara-mainline è già
  # abilitato in packages-common.yml come alternativa — basta cambiare i nomi
  # pacchetto qui sotto.
  - type: containerfile
    snippets:
      - |
        RUN set -euo pipefail && \
            dnf5 -y remove kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra --noautoremove && \
            dnf5 -y install --allowerasing kernel-cachyos kernel-cachyos-devel-matched

  # ───────────────────────────────────────────────
  # ─ LIBVIRT ─────────────────────────────────────
  # ───────────────────────────────────────────────
  # Nota: Fedora 44 usa i demoni libvirt modulari (virtqemud, virtnetworkd, ecc.)
  # al posto del vecchio libvirtd monolitico. libvirtd.service resta come proxy
  # di compatibilità ma i socket modulari sono il percorso raccomandato.
  - type: containerfile
    snippets:
      - |
        RUN set -euo pipefail && \
            dnf -y install \
              libvirt \
              libvirt-daemon-kvm \
              libvirt-daemon-config-network \
              qemu-kvm \
              virt-install \
              bridge-utils && \
            for socket in virtqemud virtnetworkd virtstoraged virtnodedevd virtsecretd virtlogd virtlockd; do \
              systemctl enable ${socket}.socket; \
            done

  # ───────────────────────────────────────────────
  # ─ PLASMOIDI EXTRA (build-time) ─────────────────
  # ───────────────────────────────────────────────
  # Plasmoid QML puri, nessuna dipendenza da compilare: si installano con
  # kpackagetool6. Il flag -g/--global è essenziale qui: senza, kpackagetool6
  # installerebbe in /root/.local (home di root durante la build), invisibile
  # all'utente reale. Con -g finisce in /usr/share/plasma/plasmoids/, quindi
  # baked nell'immagine per tutti gli utenti.
  #
  # plasma-wallpaper-effects: il suo install.sh usa cmake con prefisso $HOME/.local
  # (in build = /root/.local, inutile). Il CMakeLists non compila nulla: fa solo
  # plasma_install_package(package ...), quindi qui si installa la stessa
  # cartella package/ con kpackagetool6 -g, senza dipendenze di build extra.
  # plasmoid-protonvpn RIMOSSO: il suo backend è la CLI "protonvpn" di sistema,
  # che il Flatpak di Proton VPN non fornisce; inoltre è un "early port" (WIP).
  # plasmoid-tailscale richiede il binario "tailscale" in $PATH: verifica che
  # sia effettivamente installato da qualche parte nel recipe (non risulta nei
  # file che ho — solo tailscaled.service è abilitato in systemd.yml).
  - type: containerfile
    snippets:
      - |
        RUN set -euo pipefail && \
            dnf install -y git && \
            git clone --depth=1 https://github.com/MikeDevQH/plasma6-widget-desktop /tmp/plasma6-widget-desktop && \
            kpackagetool6 -g -t Plasma/Applet -i /tmp/plasma6-widget-desktop && \
            git clone --depth=1 https://github.com/GG2R10/gamemoder /tmp/gamemoder && \
            kpackagetool6 -g -t Plasma/Applet -i /tmp/gamemoder/package && \
            git clone --depth=1 https://github.com/s-celles/plasmoid-tailscale /tmp/plasmoid-tailscale && \
            kpackagetool6 -g -t Plasma/Applet -i /tmp/plasmoid-tailscale && \
            git clone --depth=1 https://github.com/luisbocanegra/plasma-wallpaper-effects /tmp/plasma-wallpaper-effects && \
            kpackagetool6 -g -t Plasma/Applet -i /tmp/plasma-wallpaper-effects/package && \
            rm -rf /tmp/plasma6-widget-desktop /tmp/gamemoder /tmp/plasmoid-tailscale /tmp/plasma-wallpaper-effects && \
            dnf clean all && \
            rm -rf /var/cache/dnf

  # ───────────────────────────────────────────────
  # ─ ADW-TINT-KDE (GTK4 tint) ─────────────────────
  # ───────────────────────────────────────────────
  # Solo 2 file CSS statici, nessuna compilazione. Vanno in ~/.config/gtk-4.0/,
  # quindi qui li mettiamo in /etc/skel/ (lo scheletro copiato nella home di un
  # utente appena creato — funziona per il caso "reinstallo da zero", ma NON
  # retroattivo su un utente/home già esistente: in quel caso vanno copiati a
  # mano una tantum in ~/.config/gtk-4.0/).
  #
  # Prerequisito manuale (non scriptabile qui, è una preferenza estetica
  # dell'utente): System Settings > Colours & Themes > Colours > matita sullo
  # schema scelto > Options > "Tint all colours with accent colour".
  - type: containerfile
    snippets:
      - |
        RUN set -euo pipefail && \
            dnf install -y git && \
            git clone --depth=1 https://github.com/n3thshan/adw-tint-kde /tmp/adw-tint-kde && \
            mkdir -p /etc/skel/.config/gtk-4.0 && \
            cp /tmp/adw-tint-kde/gtk.css /tmp/adw-tint-kde/window_controls.css /etc/skel/.config/gtk-4.0/ && \
            rm -rf /tmp/adw-tint-kde && \
            dnf clean all && \
            rm -rf /var/cache/dnf
      - |
        # Permesso Flatpak a livello di sistema, cosi le app in sandbox vedono
        # il CSS GTK4 personalizzato (altrimenti "flatpak override --user" andrebbe
        # ripetuto per ogni utente al runtime, non a build-time)
        RUN mkdir -p /var/lib/flatpak/overrides && \
            printf '[Context]\nfilesystems=xdg-config/gtk-4.0:ro;\n' >> /var/lib/flatpak/overrides/global

  # ───────────────────────────────────────────────
  # ─ YAFTI ───────────────────────────────────────
  # ───────────────────────────────────────────────
  - type: containerfile
    snippets:
      - |
        RUN set -euo pipefail && \
            git clone --depth=1 https://github.com/ProjectGDL/yafti /tmp/yafti-repo && \
            cd /tmp/yafti-repo && \
            make install DESTDIR=/ PREFIX=/usr && \
            rm -rf /tmp/yafti-repo

  # ───────────────────────────────────────────────
  # ─ OH-MY-ZSH ───────────────────────────────────
  # ───────────────────────────────────────────────
  # Nota: git NON viene rimosso a fine script — è anche un pacchetto voluto
  # permanentemente in packages-common.yml (git-credential-libsecret ne
  # dipende), quindi rimuoverlo qui lo avrebbe tolto dall'immagine finale.
  - type: containerfile
    snippets:
      - |
        RUN set -euo pipefail && \
            dnf install -y git && \
            git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh /usr/share/oh-my-zsh && \
            git clone --depth=1 https://github.com/zsh-users/zsh-syntax-highlighting /usr/share/oh-my-zsh/custom/plugins/zsh-syntax-highlighting && \
            rm -rf /usr/share/oh-my-zsh/.git /usr/share/oh-my-zsh/custom/plugins/zsh-syntax-highlighting/.git && \
            chmod -R a+rX /usr/share/oh-my-zsh && \
            dnf clean all && \
            rm -rf /var/cache/dnf

  # ───────────────────────────────────────────────
  # ─ PULIZIA CACHE DNF ───────────────────────────
  # ───────────────────────────────────────────────
  - type: script
    snippets:
      - |
        dnf5 -y clean all

  # ───────────────────────────────────────────────
  # ─ FLATPAK ─────────────────────────────────────
  # ───────────────────────────────────────────────

  # default-flatpaks@v1: dal 4/10 il modulo "default-flatpaks" senza versione è la v2, con
  # un formato di configurazione diverso (chiave "configurations:"). Qui si resta sulla v1,
  # che il modulo stesso segnala come "deprecata ma ancora disponibile".
  - type: default-flatpaks@v1
    notify: true
    system:
      # repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      # repo-name: flathub
      # repo-title: "Flathub (system-wide)"
      remove:
        - io.github.kolunmi.Bazaar # sostituito da EasyFlatpak — vedi moissanite-alpha-testing.md (11/09/2026)
        - org.kde.kcalc
        - org.kde.okular
      install:
        - org.dupot.easyflatpak # sostituisce Bazaar
        - com.clustta.clustta
        - org.fedoraproject.MediaWriter
        - io.github.DenysMb.Kontainer
        - io.github.getnf.embellish
        - io.github.prateekmedia.appimagepool
        - org.localsend.localsend_app
        - it.mijorus.gearlever
    #    - page.codeberg.jakobdev.jdsystemmonitor
        - xyz.ketok.Speedtest
    # user # Aggiunge anche il repo Flathub utente, ma senza pacchetti utente

  # ===============================================
  # === SYSTEMD ===================================
  # ===============================================
  - type: systemd
    system:
      enabled:
        - ananicy-cpp.service
        - coolercontrold
        - falcond
        - tailscaled.service
      masked:
         - flatpak-add-fedora-repos.service
    user:
      enabled:
         - podman.socket
         - syncthing.service
    # DISATTIVATE (build del 4/10): "Unit konveyor-first-install.service does not exist": i file non sono nel repo.
    # Dopo aver copiato i 4 file in files/system/ (manuale sez. 16), riattiva le due righe togliendo
    # SOLO il "#" iniziale (il "#" sta in colonna 1, così l'indentazione resta giusta):
#         - konveyor-first-install.service
#         - syncthing-monitor-first-install.service
    #  masked:

# ─ FINE: initramfs e firma ───────────────────────
  - type: initramfs
  - type: signing
